name: Laravel Backend Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laravel-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-syntax:
    name: PHP syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Check PHP syntax in application and tests
        run: |
          set -euo pipefail
          find app Modules tests -type f -name '*.php' -print0 | xargs -0 -n 1 php -l > php-syntax.log
          tail -n 10 php-syntax.log

  cleaning-regression:
    name: Cleaning auth and team regressions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dllni_test
          MYSQL_ROOT_PASSWORD: ci_only_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_only_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: dllni_test
      DB_USERNAME: root
      DB_PASSWORD: ci_only_password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, intl, gd
          coverage: none
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Create temporary test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Build test schema
        run: php artisan migrate:fresh --force
      - name: Run focused regression tests
        run: |
          php artisan test \
            tests/Feature/UserModule/UserOtpAuthTest.php \
            tests/Feature/Auth/AuthEndpointsTest.php \
            tests/Feature/Cleaning/WorkerBookingScheduleOverlapRegressionTest.php \
            tests/Feature/Cleaning/MultiWorkerIndependentCancellationRegressionTest.php
