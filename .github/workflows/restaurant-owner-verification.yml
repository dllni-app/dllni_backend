name: Restaurant Owner Verification

on:
  push:
    branches: [dev]
    paths:
      - 'Modules/Resturants/**'
      - 'app/Http/Middleware/EnsureSellerPermission.php'
      - 'tests/Feature/Resturants/**'
      - 'tests/Feature/RestaurantOwner/**'
      - '.github/workflows/restaurant-owner-verification.yml'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - 'Modules/Resturants/**'
      - 'app/Http/Middleware/EnsureSellerPermission.php'
      - 'tests/Feature/Resturants/**'
      - 'tests/Feature/RestaurantOwner/**'
      - '.github/workflows/restaurant-owner-verification.yml'
      - 'composer.json'
      - 'composer.lock'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, bcmath, intl, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Migrate database
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Check restaurant PHP syntax
        run: |
          find Modules/Resturants tests/Feature/Resturants tests/Feature/RestaurantOwner -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Run restaurant tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: >-
          php artisan test
          tests/Feature/Resturants/InventoryItemsEndpointsTest.php
          tests/Feature/Resturants/OperatingHoursEndpointsTest.php
          tests/Feature/RestaurantOwner/RestaurantOwnerOrderScopeTest.php
          tests/Feature/RestaurantOwner/RestaurantOwnerOrderStatusTest.php
