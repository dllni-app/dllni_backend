name: Format Recurring Window Once

on:
  push:
    branches:
      - feature/cleaning-suite-main
    paths:
      - '.github/workflows/format-recurring-window-once.yml'

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cleaning-suite-main
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, bcmath, intl, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Format recurring window changes
        run: |
          vendor/bin/pint \
            Modules/User/app/Http/Requests/Concerns/ValidatesEventAssistanceSchedule.php \
            tests/Feature/UserModule/RecurringCleaningScheduleTest.php
      - name: Prepare application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
      - name: Verify recurring tests
        run: |
          php artisan test \
            tests/Feature/UserModule/RecurringCleaningScheduleTest.php \
            tests/Feature/Cleaning/RecurringCleaningWorkerContinuityTest.php \
            tests/Feature/UserModule/EventAssistanceMultiDayScheduleTest.php
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Modules/User/app/Http/Requests/Concerns/ValidatesEventAssistanceSchedule.php \
            tests/Feature/UserModule/RecurringCleaningScheduleTest.php
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(cleaning): format recurring window validation"
          git push origin HEAD:feature/cleaning-suite-main
