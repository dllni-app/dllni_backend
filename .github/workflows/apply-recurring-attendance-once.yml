name: Apply Recurring Attendance Once

on:
  push:
    branches:
      - feature/cleaning-suite-main
    paths:
      - 'scripts/apply_recurring_attendance_patch.py'
      - '.github/workflows/apply-recurring-attendance-once.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/cleaning-suite-main

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, bcmath, intl, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Apply bounded patch
        run: python scripts/apply_recurring_attendance_patch.py

      - name: Format changed PHP
        run: |
          vendor/bin/pint \
            config/cleaning_attendance.php \
            Modules/Cleaning/database/migrations/2026_09_06_230530_add_attendance_tracking_to_cleaning_booking_session_worker_assignments_table.php \
            Modules/Cleaning/app/Models/CleaningBookingSessionWorkerAssignment.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionAttendanceService.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionLifecycleService.php \
            Modules/Cleaning/app/Services/CleaningBookingSchedulePresenter.php \
            Modules/Cleaning/app/Http/Controllers/API/CleaningBookingSessionLifecycleController.php \
            Modules/Cleaning/routes/sessions.php \
            app/Filament/Resources/CleaningBookings/Tables/CleaningBookingsTable.php \
            app/Filament/Resources/CleaningBookings/Pages/ViewCleaningBooking.php \
            tests/Feature/Cleaning/RecurringCleaningAttendanceTest.php

      - name: Prepare application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Migrate database
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Run attendance and recurring regressions
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          php artisan test \
            tests/Feature/Cleaning/RecurringCleaningAttendanceTest.php \
            tests/Feature/Cleaning/RecurringCleaningWorkerScopeTest.php \
            tests/Feature/Cleaning/RecurringCleaningCoverageNotificationTest.php \
            tests/Feature/UserModule/RecurringCleaningScheduleTest.php \
            tests/Feature/UserModule/RecurringCleaningScheduleRevisionTest.php \
            tests/Feature/UserModule/EventAssistanceMultiDayScheduleTest.php

      - name: Commit verified feature files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            config/cleaning_attendance.php \
            Modules/Cleaning/database/migrations/2026_09_06_230530_add_attendance_tracking_to_cleaning_booking_session_worker_assignments_table.php \
            Modules/Cleaning/app/Models/CleaningBookingSessionWorkerAssignment.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionAttendanceService.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionLifecycleService.php \
            Modules/Cleaning/app/Services/CleaningBookingSchedulePresenter.php \
            Modules/Cleaning/app/Http/Controllers/API/CleaningBookingSessionLifecycleController.php \
            Modules/Cleaning/routes/sessions.php \
            app/Filament/Resources/CleaningBookings/Tables/CleaningBookingsTable.php \
            app/Filament/Resources/CleaningBookings/Pages/ViewCleaningBooking.php \
            tests/Feature/Cleaning/RecurringCleaningAttendanceTest.php
          if git diff --cached --quiet; then
            echo 'No feature changes to commit.'
            exit 0
          fi
          git commit -m 'feat(cleaning): add recurring late and no-travel handling'
          git push origin HEAD:feature/cleaning-suite-main
