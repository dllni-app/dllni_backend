name: Apply Recurring Pause Resume Once

on:
  push:
    branches:
      - feature/cleaning-suite-main
    paths:
      - '.github/workflows/apply-recurring-pause-resume-once.yml'
      - 'scripts/apply_recurring_pause_resume_patch.py'
      - 'scripts/fix_recurring_pause_resume_constant.py'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cleaning-suite-main
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, bcmath, intl, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply recurring pause resume patch
        run: |
          python scripts/apply_recurring_pause_resume_patch.py
          python scripts/fix_recurring_pause_resume_constant.py
      - name: Format changes
        run: |
          vendor/bin/pint \
            database/migrations/2026_09_05_000010_add_recurring_pause_fields_to_cleaning_bookings_table.php \
            Modules/Cleaning/app/Enums/CleaningBookingSessionStatus.php \
            Modules/Cleaning/app/Models/CleaningBooking.php \
            Modules/Cleaning/app/Models/CleaningBookingSession.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionFinancialAggregationService.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionCancellationService.php \
            Modules/Cleaning/app/Services/RecurringCleaningPauseService.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionAcceptanceService.php \
            Modules/Cleaning/app/Services/CleaningBookingSchedulePresenter.php \
            Modules/Cleaning/app/Http/Controllers/API/CleaningRecurringSeriesController.php \
            Modules/Cleaning/routes/sessions.php \
            tests/Feature/Cleaning/RecurringCleaningWorkerContinuityTest.php
      - name: Prepare application
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force
      - name: Verify pause resume and recurring regressions
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        shell: bash
        run: |
          set -o pipefail
          php artisan test \
            tests/Feature/Cleaning/RecurringCleaningWorkerContinuityTest.php \
            tests/Feature/Cleaning/RecurringCleaningPreferredWorkerFallbackTest.php \
            tests/Feature/UserModule/RecurringCleaningScheduleTest.php \
            tests/Feature/UserModule/EventAssistanceMultiDayScheduleTest.php \
            2>&1 | tee recurring-pause-resume-test.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recurring-pause-resume-diagnostics
          path: recurring-pause-resume-test.log
          if-no-files-found: ignore
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            database/migrations/2026_09_05_000010_add_recurring_pause_fields_to_cleaning_bookings_table.php \
            Modules/Cleaning/app/Enums/CleaningBookingSessionStatus.php \
            Modules/Cleaning/app/Models/CleaningBooking.php \
            Modules/Cleaning/app/Models/CleaningBookingSession.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionFinancialAggregationService.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionCancellationService.php \
            Modules/Cleaning/app/Services/RecurringCleaningPauseService.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionAcceptanceService.php \
            Modules/Cleaning/app/Services/CleaningBookingSchedulePresenter.php \
            Modules/Cleaning/app/Http/Controllers/API/CleaningRecurringSeriesController.php \
            Modules/Cleaning/routes/sessions.php \
            tests/Feature/Cleaning/RecurringCleaningWorkerContinuityTest.php
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(cleaning): pause and resume recurring series"
          git push origin HEAD:feature/cleaning-suite-main
