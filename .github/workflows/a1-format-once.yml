name: A1 Format Once

on:
  push:
    branches:
      - feature/cleaning-suite-agent-a-closeout

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Agent A branch
        uses: actions/checkout@v4
        with:
          ref: feature/cleaning-suite-agent-a-closeout
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Format Agent A controller
        run: vendor/bin/pint Modules/Cleaning/app/Http/Controllers/API/CleaningBookingScheduleController.php

      - name: Commit formatter result and remove one-time workflow
        run: |
          rm .github/workflows/a1-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Modules/Cleaning/app/Http/Controllers/API/CleaningBookingScheduleController.php .github/workflows/a1-format-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(cleaning): format attendance schedule controller"
          git push origin HEAD:feature/cleaning-suite-agent-a-closeout
