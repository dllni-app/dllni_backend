name: Cleaning Multi-Day Event

on:
  push:
    branches:
      - feature/cleaning-suite-agent-a-closeout
      - feature/cleaning-suite-main
    paths:
      - 'Modules/Cleaning/app/Http/Controllers/API/CleaningBookingScheduleController.php'
      - 'Modules/Cleaning/app/Http/Controllers/API/CleaningBookingSessionScheduleController.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingCustomerScheduleService.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingSessionAcceptanceService.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingSessionCapabilityService.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingSessionFinancialAggregationService.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingSessionParentStateService.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingSessionCancellationService.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingSessionWorkerChangeService.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingWorkerScheduleService.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingWorkerSessionVisibilityService.php'
      - 'Modules/Cleaning/app/Services/WorkerBookingScheduleConflictService.php'
      - 'Modules/Cleaning/routes/sessions.php'
      - 'Modules/User/app/Services/EventAssistanceScheduleService.php'
      - 'Modules/User/app/Services/EventAssistanceSessionRescheduleService.php'
      - 'tests/Feature/Cleaning/MultiDayEventAssistanceCloseoutTest.php'
      - 'tests/Feature/Cleaning/CleaningBookingSessionCancellationAndSosTest.php'
      - 'tests/Feature/Cleaning/CleaningBookingSessionWorkerChangeTest.php'
      - 'tests/Feature/Cleaning/CleaningBookingWorkerScheduleVisibilityTest.php'
      - 'tests/Feature/UserModule/EventAssistanceMultiDayScheduleTest.php'
      - '.github/workflows/cleaning-multi-day-event.yml'
  pull_request:
    paths:
      - 'Modules/Cleaning/app/Http/Controllers/API/CleaningBookingScheduleController.php'
      - 'Modules/Cleaning/app/Http/Controllers/API/CleaningBookingSessionScheduleController.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingCustomerScheduleService.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingSessionAcceptanceService.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingSessionCapabilityService.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingSessionFinancialAggregationService.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingSessionParentStateService.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingSessionCancellationService.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingSessionWorkerChangeService.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingWorkerScheduleService.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingWorkerSessionVisibilityService.php'
      - 'Modules/Cleaning/app/Services/WorkerBookingScheduleConflictService.php'
      - 'Modules/Cleaning/routes/sessions.php'
      - 'Modules/User/app/Services/EventAssistanceScheduleService.php'
      - 'Modules/User/app/Services/EventAssistanceSessionRescheduleService.php'
      - 'tests/Feature/Cleaning/MultiDayEventAssistanceCloseoutTest.php'
      - 'tests/Feature/Cleaning/CleaningBookingSessionCancellationAndSosTest.php'
      - 'tests/Feature/Cleaning/CleaningBookingSessionWorkerChangeTest.php'
      - 'tests/Feature/Cleaning/CleaningBookingWorkerScheduleVisibilityTest.php'
      - 'tests/Feature/UserModule/EventAssistanceMultiDayScheduleTest.php'
      - '.github/workflows/cleaning-multi-day-event.yml'

jobs:
  multi-day-closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, bcmath, intl, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Migrate database
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Check A3 formatting
        run: |
          vendor/bin/pint --test \
            Modules/Cleaning/app/Http/Controllers/API/CleaningBookingScheduleController.php \
            Modules/Cleaning/app/Http/Controllers/API/CleaningBookingSessionScheduleController.php \
            Modules/Cleaning/app/Services/CleaningBookingCustomerScheduleService.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionAcceptanceService.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionCapabilityService.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionFinancialAggregationService.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionParentStateService.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionCancellationService.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionWorkerChangeService.php \
            Modules/Cleaning/app/Services/CleaningBookingWorkerScheduleService.php \
            Modules/Cleaning/app/Services/CleaningBookingWorkerSessionVisibilityService.php \
            Modules/Cleaning/app/Services/WorkerBookingScheduleConflictService.php \
            Modules/Cleaning/routes/sessions.php \
            Modules/User/app/Services/EventAssistanceScheduleService.php \
            Modules/User/app/Services/EventAssistanceSessionRescheduleService.php \
            tests/Feature/Cleaning/MultiDayEventAssistanceCloseoutTest.php \
            tests/Feature/Cleaning/CleaningBookingWorkerScheduleVisibilityTest.php

      - name: Run A3 regression tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          php artisan test \
            tests/Feature/Cleaning/MultiDayEventAssistanceCloseoutTest.php \
            tests/Feature/Cleaning/CleaningBookingWorkerScheduleVisibilityTest.php \
            tests/Feature/Cleaning/CleaningBookingSessionCancellationAndSosTest.php \
            tests/Feature/Cleaning/CleaningBookingSessionWorkerChangeTest.php \
            tests/Feature/UserModule/EventAssistanceMultiDayScheduleTest.php
