# Check-only recurring cleaning verification, including per-session attendance escalation and admin reporting. This workflow must never modify repository content.
name: Cleaning Recurring

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cleaning-suite-main
    paths:
      - 'Modules/Cleaning/**'
      - 'Modules/User/app/Http/Controllers/API/UserCleaningOrderEstimatePriceController.php'
      - 'Modules/User/app/Http/Controllers/API/UserCleaningOrderStoreController.php'
      - 'Modules/User/app/Http/Controllers/API/UserRecurringCleaningScheduleRevisionController.php'
      - 'Modules/User/app/Http/Requests/Concerns/ValidatesEventAssistanceSchedule.php'
      - 'Modules/User/app/Http/Requests/Concerns/ValidatesRecurringWorkerScope.php'
      - 'Modules/User/app/Http/Requests/UserCleaningOrderEstimatePriceRequest.php'
      - 'Modules/User/app/Http/Requests/UserCleaningOrderStoreRequest.php'
      - 'Modules/User/app/Http/Requests/UserRecurringCleaningScheduleRevisionRequest.php'
      - 'Modules/User/app/Http/Resources/UserCleaningBookingResource.php'
      - 'Modules/User/app/Services/RecurringCleaningScheduleService.php'
      - 'Modules/User/app/Services/RecurringCleaningScheduleRevisionService.php'
      - 'Modules/User/app/Services/UserCleaningOrderEstimationService.php'
      - 'Modules/User/app/Services/UserCleaningOrderService.php'
      - 'Modules/User/routes/api.php'
      - 'app/Data/DisputeData.php'
      - 'app/Filament/Resources/CleaningBookings/Pages/ViewCleaningBooking.php'
      - 'app/Filament/Resources/CleaningBookings/Tables/CleaningBookingsTable.php'
      - 'app/Http/Controllers/API/DisputeController.php'
      - 'app/Http/Controllers/API/UserNotificationController.php'
      - 'app/Http/Requests/DisputeRequest.php'
      - 'app/Http/Resources/DisputeResource.php'
      - 'app/Http/Resources/UserNotificationResource.php'
      - 'app/Jobs/NotifyEligibleWorkersNewOrderJob.php'
      - 'app/Models/Dispute.php'
      - 'app/Models/WorkerCustomerRating.php'
      - 'app/Notifications/Cleaning/BookingLifecycleNotification.php'
      - 'app/Notifications/Core/NotificationFeedNormalizer.php'
      - 'app/Notifications/Core/NotificationTypeRegistry.php'
      - 'config/cleaning_attendance.php'
      - 'config/cleaning_recurring_notification_types.php'
      - 'database/migrations/2026_09_05_000010_add_recurring_pause_fields_to_cleaning_bookings_table.php'
      - 'database/migrations/2026_09_06_000001_add_recurring_worker_scope_to_cleaning_bookings_table.php'
      - 'database/migrations/2026_09_06_000020_add_delivery_view_state_to_notifications_table.php'
      - 'tests/Feature/Cleaning/RecurringCleaningAttendanceTest.php'
      - 'tests/Feature/Cleaning/RecurringCleaningSessionInteractionsTest.php'
      - 'tests/Feature/Cleaning/RecurringCleaningCoverageNotificationTest.php'
      - 'tests/Feature/Cleaning/RecurringCleaningPreferredWorkerFallbackTest.php'
      - 'tests/Feature/Cleaning/RecurringCleaningWorkerContinuityTest.php'
      - 'tests/Feature/Cleaning/RecurringCleaningWorkerScopeTest.php'
      - 'tests/Feature/UserModule/RecurringCleaningScheduleTest.php'
      - 'tests/Feature/UserModule/RecurringCleaningScheduleRevisionTest.php'
      - 'tests/Feature/UserModule/UserNotificationInteractionStateTest.php'
      - '.github/workflows/cleaning-recurring.yml'
  pull_request:
    paths:
      - 'Modules/Cleaning/**'
      - 'Modules/User/app/Http/Controllers/API/UserCleaningOrderEstimatePriceController.php'
      - 'Modules/User/app/Http/Controllers/API/UserCleaningOrderStoreController.php'
      - 'Modules/User/app/Http/Controllers/API/UserRecurringCleaningScheduleRevisionController.php'
      - 'Modules/User/app/Http/Requests/Concerns/ValidatesEventAssistanceSchedule.php'
      - 'Modules/User/app/Http/Requests/Concerns/ValidatesRecurringWorkerScope.php'
      - 'Modules/User/app/Http/Requests/UserCleaningOrderEstimatePriceRequest.php'
      - 'Modules/User/app/Http/Requests/UserCleaningOrderStoreRequest.php'
      - 'Modules/User/app/Http/Requests/UserRecurringCleaningScheduleRevisionRequest.php'
      - 'Modules/User/app/Http/Resources/UserCleaningBookingResource.php'
      - 'Modules/User/app/Services/RecurringCleaningScheduleService.php'
      - 'Modules/User/app/Services/RecurringCleaningScheduleRevisionService.php'
      - 'Modules/User/app/Services/UserCleaningOrderEstimationService.php'
      - 'Modules/User/app/Services/UserCleaningOrderService.php'
      - 'Modules/User/routes/api.php'
      - 'app/Data/DisputeData.php'
      - 'app/Filament/Resources/CleaningBookings/Pages/ViewCleaningBooking.php'
      - 'app/Filament/Resources/CleaningBookings/Tables/CleaningBookingsTable.php'
      - 'app/Http/Controllers/API/DisputeController.php'
      - 'app/Http/Controllers/API/UserNotificationController.php'
      - 'app/Http/Requests/DisputeRequest.php'
      - 'app/Http/Resources/DisputeResource.php'
      - 'app/Http/Resources/UserNotificationResource.php'
      - 'app/Jobs/NotifyEligibleWorkersNewOrderJob.php'
      - 'app/Models/Dispute.php'
      - 'app/Models/WorkerCustomerRating.php'
      - 'app/Notifications/Cleaning/BookingLifecycleNotification.php'
      - 'app/Notifications/Core/NotificationFeedNormalizer.php'
      - 'app/Notifications/Core/NotificationTypeRegistry.php'
      - 'config/cleaning_attendance.php'
      - 'config/cleaning_recurring_notification_types.php'
      - 'database/migrations/2026_09_05_000010_add_recurring_pause_fields_to_cleaning_bookings_table.php'
      - 'database/migrations/2026_09_06_000001_add_recurring_worker_scope_to_cleaning_bookings_table.php'
      - 'database/migrations/2026_09_06_000020_add_delivery_view_state_to_notifications_table.php'
      - 'tests/Feature/Cleaning/RecurringCleaningAttendanceTest.php'
      - 'tests/Feature/Cleaning/RecurringCleaningSessionInteractionsTest.php'
      - 'tests/Feature/Cleaning/RecurringCleaningCoverageNotificationTest.php'
      - 'tests/Feature/Cleaning/RecurringCleaningPreferredWorkerFallbackTest.php'
      - 'tests/Feature/Cleaning/RecurringCleaningWorkerContinuityTest.php'
      - 'tests/Feature/Cleaning/RecurringCleaningWorkerScopeTest.php'
      - 'tests/Feature/UserModule/RecurringCleaningScheduleTest.php'
      - 'tests/Feature/UserModule/RecurringCleaningScheduleRevisionTest.php'
      - 'tests/Feature/UserModule/UserNotificationInteractionStateTest.php'
      - '.github/workflows/cleaning-recurring.yml'

permissions:
  contents: read

jobs:
  recurring-cleaning:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, bcmath, intl, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Migrate database
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Check formatting
        run: |
          vendor/bin/pint --test \
            config/cleaning_attendance.php \
            Modules/Cleaning/database/migrations/2026_09_06_000030_add_interaction_state_to_cleaning_booking_sessions.php \
            Modules/Cleaning/database/migrations/2026_09_06_230530_add_attendance_tracking_to_cleaning_booking_session_worker_assignments_table.php \
            Modules/Cleaning/app/Models/CleaningBookingSession.php \
            Modules/Cleaning/app/Models/CleaningBookingSessionWorkerAssignment.php \
            Modules/Cleaning/app/Observers/CleaningBookingObserver.php \
            Modules/Cleaning/app/Services/DepositService.php \
            Modules/Cleaning/app/Services/CleaningBookingSchedulePresenter.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionAttendanceService.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionLifecycleService.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionInteractionService.php \
            Modules/Cleaning/app/Http/Controllers/API/CleaningBookingSessionLifecycleController.php \
            Modules/Cleaning/app/Http/Controllers/API/CleaningBookingSessionInteractionController.php \
            Modules/Cleaning/routes/sessions.php \
            app/Filament/Resources/CleaningBookings/Pages/ViewCleaningBooking.php \
            app/Filament/Resources/CleaningBookings/Tables/CleaningBookingsTable.php \
            app/Models/WorkerCustomerRating.php \
            app/Models/Dispute.php \
            app/Data/DisputeData.php \
            app/Http/Requests/DisputeRequest.php \
            app/Http/Resources/DisputeResource.php \
            app/Http/Controllers/API/DisputeController.php \
            app/Http/Controllers/API/UserNotificationController.php \
            app/Http/Resources/UserNotificationResource.php \
            app/Notifications/Cleaning/BookingLifecycleNotification.php \
            app/Notifications/Core/NotificationFeedNormalizer.php \
            app/Notifications/Core/NotificationTypeRegistry.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionCoverageService.php \
            Modules/Cleaning/app/Services/RecurringCleaningCoverageNotificationService.php \
            tests/Feature/Cleaning/RecurringCleaningAttendanceTest.php \
            tests/Feature/Cleaning/RecurringCleaningSessionInteractionsTest.php \
            tests/Feature/Cleaning/RecurringCleaningCoverageNotificationTest.php \
            tests/Feature/Cleaning/RecurringCleaningPreferredWorkerFallbackTest.php \
            tests/Feature/Cleaning/RecurringCleaningWorkerContinuityTest.php \
            tests/Feature/Cleaning/RecurringCleaningWorkerScopeTest.php \
            tests/Feature/UserModule/RecurringCleaningScheduleTest.php \
            tests/Feature/UserModule/RecurringCleaningScheduleRevisionTest.php \
            tests/Feature/UserModule/UserNotificationInteractionStateTest.php

      - name: Run recurring cleaning tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        shell: bash
        run: |
          set -o pipefail
          php artisan test \
            tests/Feature/Cleaning/RecurringCleaningAttendanceTest.php \
            tests/Feature/Cleaning/RecurringCleaningSessionInteractionsTest.php \
            tests/Feature/UserModule/UserNotificationInteractionStateTest.php \
            tests/Feature/Cleaning/RecurringCleaningCoverageNotificationTest.php \
            tests/Feature/UserModule/RecurringCleaningScheduleRevisionTest.php \
            tests/Feature/UserModule/RecurringCleaningScheduleTest.php \
            tests/Feature/Cleaning/RecurringCleaningWorkerScopeTest.php \
            tests/Feature/Cleaning/RecurringCleaningPreferredWorkerFallbackTest.php \
            tests/Feature/Cleaning/RecurringCleaningWorkerContinuityTest.php \
            tests/Feature/Cleaning/CleaningNewOrderDispatchTest.php \
            tests/Feature/UserModule/EventAssistanceMultiDayScheduleTest.php \
            2>&1 | tee recurring-cleaning-test.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recurring-cleaning-diagnostics
          path: recurring-cleaning-test.log
          if-no-files-found: ignore
