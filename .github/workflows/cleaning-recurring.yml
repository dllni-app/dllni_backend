name: Cleaning Recurring

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cleaning-suite-main
    paths:
      - 'database/migrations/2026_09_05_000010_add_recurring_pause_fields_to_cleaning_bookings_table.php'
      - 'Modules/Cleaning/app/Enums/CleaningBookingSessionStatus.php'
      - 'Modules/Cleaning/app/Models/CleaningBooking.php'
      - 'Modules/Cleaning/app/Models/CleaningBookingSession.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingSchedulePresenter.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingSessionAcceptanceService.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingSessionCancellationService.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingSessionFinancialAggregationService.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingSessionWorkerChangeService.php'
      - 'Modules/Cleaning/app/Services/CleaningPreferredWorkerFallbackService.php'
      - 'Modules/Cleaning/app/Services/RecurringCleaningPauseService.php'
      - 'Modules/Cleaning/app/Http/Controllers/API/CleaningBookingSessionLifecycleController.php'
      - 'Modules/Cleaning/app/Http/Controllers/API/CleaningBookingSessionWorkerChangeController.php'
      - 'Modules/Cleaning/app/Http/Controllers/API/CleaningRecurringSeriesController.php'
      - 'Modules/Cleaning/routes/sessions.php'
      - 'Modules/User/app/Http/Controllers/API/UserCleaningOrderEstimatePriceController.php'
      - 'Modules/User/app/Http/Controllers/API/UserCleaningOrderStoreController.php'
      - 'Modules/User/app/Http/Controllers/API/UserRecurringCleaningScheduleRevisionController.php'
      - 'Modules/User/app/Http/Requests/Concerns/ValidatesEventAssistanceSchedule.php'
      - 'Modules/User/app/Http/Requests/UserRecurringCleaningScheduleRevisionRequest.php'
      - 'Modules/User/app/Services/RecurringCleaningScheduleService.php'
      - 'Modules/User/app/Services/RecurringCleaningScheduleRevisionService.php'
      - 'Modules/User/routes/api.php'
      - 'tests/Feature/Cleaning/RecurringCleaningPreferredWorkerFallbackTest.php'
      - 'tests/Feature/Cleaning/RecurringCleaningWorkerContinuityTest.php'
      - 'tests/Feature/UserModule/RecurringCleaningScheduleTest.php'
      - 'tests/Feature/UserModule/RecurringCleaningScheduleRevisionTest.php'
      - '.github/workflows/cleaning-recurring.yml'
  pull_request:
    paths:
      - 'database/migrations/2026_09_05_000010_add_recurring_pause_fields_to_cleaning_bookings_table.php'
      - 'Modules/Cleaning/app/Enums/CleaningBookingSessionStatus.php'
      - 'Modules/Cleaning/app/Models/CleaningBooking.php'
      - 'Modules/Cleaning/app/Models/CleaningBookingSession.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingSchedulePresenter.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingSessionAcceptanceService.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingSessionCancellationService.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingSessionFinancialAggregationService.php'
      - 'Modules/Cleaning/app/Services/CleaningBookingSessionWorkerChangeService.php'
      - 'Modules/Cleaning/app/Services/CleaningPreferredWorkerFallbackService.php'
      - 'Modules/Cleaning/app/Services/RecurringCleaningPauseService.php'
      - 'Modules/Cleaning/app/Http/Controllers/API/CleaningBookingSessionLifecycleController.php'
      - 'Modules/Cleaning/app/Http/Controllers/API/CleaningBookingSessionWorkerChangeController.php'
      - 'Modules/Cleaning/app/Http/Controllers/API/CleaningRecurringSeriesController.php'
      - 'Modules/Cleaning/routes/sessions.php'
      - 'Modules/User/app/Http/Controllers/API/UserCleaningOrderEstimatePriceController.php'
      - 'Modules/User/app/Http/Controllers/API/UserCleaningOrderStoreController.php'
      - 'Modules/User/app/Http/Controllers/API/UserRecurringCleaningScheduleRevisionController.php'
      - 'Modules/User/app/Http/Requests/Concerns/ValidatesEventAssistanceSchedule.php'
      - 'Modules/User/app/Http/Requests/UserRecurringCleaningScheduleRevisionRequest.php'
      - 'Modules/User/app/Services/RecurringCleaningScheduleService.php'
      - 'Modules/User/app/Services/RecurringCleaningScheduleRevisionService.php'
      - 'Modules/User/routes/api.php'
      - 'tests/Feature/Cleaning/RecurringCleaningPreferredWorkerFallbackTest.php'
      - 'tests/Feature/Cleaning/RecurringCleaningWorkerContinuityTest.php'
      - 'tests/Feature/UserModule/RecurringCleaningScheduleTest.php'
      - 'tests/Feature/UserModule/RecurringCleaningScheduleRevisionTest.php'
      - '.github/workflows/cleaning-recurring.yml'

permissions:
  contents: read

jobs:
  recurring-cleaning:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, bcmath, intl, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Migrate database
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Check formatting
        run: |
          vendor/bin/pint --test \
            database/migrations/2026_09_05_000010_add_recurring_pause_fields_to_cleaning_bookings_table.php \
            Modules/Cleaning/app/Enums/CleaningBookingSessionStatus.php \
            Modules/Cleaning/app/Models/CleaningBooking.php \
            Modules/Cleaning/app/Models/CleaningBookingSession.php \
            Modules/Cleaning/app/Services/CleaningBookingSchedulePresenter.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionAcceptanceService.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionCancellationService.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionFinancialAggregationService.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionWorkerChangeService.php \
            Modules/Cleaning/app/Services/CleaningPreferredWorkerFallbackService.php \
            Modules/Cleaning/app/Services/RecurringCleaningPauseService.php \
            Modules/Cleaning/app/Http/Controllers/API/CleaningBookingSessionLifecycleController.php \
            Modules/Cleaning/app/Http/Controllers/API/CleaningBookingSessionWorkerChangeController.php \
            Modules/Cleaning/app/Http/Controllers/API/CleaningRecurringSeriesController.php \
            Modules/Cleaning/routes/sessions.php \
            Modules/User/app/Http/Controllers/API/UserCleaningOrderEstimatePriceController.php \
            Modules/User/app/Http/Controllers/API/UserCleaningOrderStoreController.php \
            Modules/User/app/Http/Controllers/API/UserRecurringCleaningScheduleRevisionController.php \
            Modules/User/app/Http/Requests/Concerns/ValidatesEventAssistanceSchedule.php \
            Modules/User/app/Http/Requests/UserRecurringCleaningScheduleRevisionRequest.php \
            Modules/User/app/Services/RecurringCleaningScheduleService.php \
            Modules/User/app/Services/RecurringCleaningScheduleRevisionService.php \
            Modules/User/routes/api.php \
            tests/Feature/Cleaning/RecurringCleaningPreferredWorkerFallbackTest.php \
            tests/Feature/Cleaning/RecurringCleaningWorkerContinuityTest.php \
            tests/Feature/UserModule/RecurringCleaningScheduleTest.php \
            tests/Feature/UserModule/RecurringCleaningScheduleRevisionTest.php

      - name: Run recurring cleaning tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        shell: bash
        run: |
          set -o pipefail
          php artisan test \
            tests/Feature/UserModule/RecurringCleaningScheduleRevisionTest.php \
            tests/Feature/UserModule/RecurringCleaningScheduleTest.php \
            tests/Feature/Cleaning/RecurringCleaningPreferredWorkerFallbackTest.php \
            tests/Feature/Cleaning/RecurringCleaningWorkerContinuityTest.php \
            tests/Feature/UserModule/EventAssistanceMultiDayScheduleTest.php \
            2>&1 | tee recurring-cleaning-test.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recurring-cleaning-diagnostics
          path: recurring-cleaning-test.log
          if-no-files-found: ignore
