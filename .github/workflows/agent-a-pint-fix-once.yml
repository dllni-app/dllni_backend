name: Agent A Pint Fix Once

on:
  push:
    branches:
      - feature/cleaning-suite-agent-a-closeout
    paths:
      - '.github/workflows/agent-a-pint-fix-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, bcmath, intl, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Format known Agent A blocker
        run: vendor/bin/pint Modules/User/app/Services/UserCleaningOrderService.php

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- Modules/User/app/Services/UserCleaningOrderService.php; then
            echo "No formatter changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Modules/User/app/Services/UserCleaningOrderService.php
          git commit -m "style(cleaning): fix Agent A backend Pint violation"
          git push origin HEAD:feature/cleaning-suite-agent-a-closeout
