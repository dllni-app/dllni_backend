name: Cleaning Suite

on:
  push:
    branches:
      - feature/cleaning-suite-main
    paths:
      - '.github/workflows/cleaning-suite.yml'

permissions:
  contents: write

jobs:
  finalize-event-admin-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply event admin operations patch
        run: python3 .github/scripts/finalize_event_admin_ops.py

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, bcmath, intl, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Format changed event sources
        run: |
          vendor/bin/pint \
            Modules/Cleaning/app/Models/CleaningBooking.php \
            Modules/Cleaning/app/Models/CleaningBookingSession.php \
            app/Filament/Resources/CleaningBookings/CleaningBookingResource.php \
            app/Filament/Resources/CleaningBookings/Tables/CleaningBookingsTable.php \
            app/Filament/Resources/CleaningBookings/RelationManagers/SessionsRelationManager.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionLifecycleService.php \
            Modules/Cleaning/app/Services/CleaningBookingActionNotificationService.php \
            Modules/Cleaning/app/Services/CleaningEventSessionNotificationService.php \
            Modules/Cleaning/database/migrations/2026_09_03_090500_add_customer_completed_at_to_cleaning_booking_sessions_table.php

      - name: Prepare application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Migrate database
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Run event and cleaning regression tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          php artisan test \
            tests/Feature/Cleaning/CleaningBookingSessionAcceptanceTest.php \
            tests/Feature/Cleaning/CleaningBookingSessionLifecycleTest.php \
            tests/Feature/Cleaning/CleaningBookingSessionCancellationAndSosTest.php \
            tests/Feature/UserModule/EventAssistanceMultiDayScheduleTest.php

      - name: Commit implementation
        run: |
          git rm .github/scripts/finalize_event_admin_ops.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(cleaning): finish multi-day event admin operations'
          git push
