name: Cleaning Suite

on:
  push:
    branches:
      - feature/cleaning-suite-main
    paths:
      - '.github/workflows/cleaning-suite.yml'

permissions:
  contents: write

jobs:
  finish-event-phase-one:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply event phase-one backend changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # 1) Event assistance is all-days-or-none in phase one.
          path = 'Modules/Cleaning/app/Http/Controllers/API/CleaningBookingSessionAcceptanceController.php'
          old = """        $worker = $this->worker($request);\n        $this->assertBookingOpen($cleaning_booking);\n        $sessionIds = $validated['sessionIds'] ?? $validated['session_ids'] ?? [];\n        $result = $this->acceptanceService->acceptSelectedSessions($cleaning_booking, $worker, $sessionIds);\n"""
          new = """        $worker = $this->worker($request);\n        $this->assertBookingOpen($cleaning_booking);\n\n        if (\n            (string) $cleaning_booking->property_type === 'event_assistance'\n            && CleaningBookingSession::query()->where('cleaning_booking_id', $cleaning_booking->id)->count() > 1\n        ) {\n            return response()->json([\n                'success' => false,\n                'message' => 'Multi-day event assistance requires accepting every event day in phase one.',\n                'data' => [\n                    'acceptance' => [\n                        'allAccepted' => false,\n                        'acceptedSessionIds' => [],\n                        'rejected' => [[\n                            'sessionId' => 0,\n                            'reasonCode' => 'event_all_days_required',\n                            'message' => 'You must be available for and accept all event days.',\n                        ]],\n                    ],\n                    'coverage' => $this->coverage($cleaning_booking),\n                ],\n            ], Response::HTTP_UNPROCESSABLE_ENTITY);\n        }\n\n        $sessionIds = $validated['sessionIds'] ?? $validated['session_ids'] ?? [];\n        $result = $this->acceptanceService->acceptSelectedSessions($cleaning_booking, $worker, $sessionIds);\n"""
          replace(path, old, new)

          # 2) Do not dispatch a multi-day event to a worker unless every day is available and conflict-free.
          path = 'app/Jobs/NotifyEligibleWorkersNewOrderJob.php'
          replace(path,
              "use Modules\\Cleaning\\Enums\\CleaningBookingWorkerAssignmentStatus;\n",
              "use Modules\\Cleaning\\Enums\\CleaningBookingSessionStatus;\nuse Modules\\Cleaning\\Enums\\CleaningBookingWorkerAssignmentStatus;\n")
          replace(path,
              "use Modules\\Cleaning\\Models\\CleaningBooking;\n",
              "use Modules\\Cleaning\\Models\\CleaningBooking;\nuse Modules\\Cleaning\\Models\\CleaningBookingSession;\n")
          replace(path,
              "use Modules\\Cleaning\\Services\\WorkerOrderSolvencyService;\n",
              "use Modules\\Cleaning\\Services\\WorkerBookingScheduleConflictService;\nuse Modules\\Cleaning\\Services\\WorkerOrderSolvencyService;\n")
          replace(path,
              "        $solvencyService = app(WorkerOrderSolvencyService::class);\n        $bookingDateTime = $this->bookingDateTime($booking);\n",
              "        $solvencyService = app(WorkerOrderSolvencyService::class);\n        $scheduleConflictService = app(WorkerBookingScheduleConflictService::class);\n        $bookingDateTime = $this->bookingDateTime($booking);\n")
          text = Path(path).read_text()
          text = text.replace(
              "$this->isDispatchable($worker, $bookingDateTime, $depositService)",
              "$this->isDispatchable($worker, $booking, $bookingDateTime, $depositService, $scheduleConflictService)",
          )
          Path(path).write_text(text)
          old = """    private function isDispatchable(Worker $worker, ?Carbon $bookingDateTime, DepositService $depositService): bool\n    {\n        return $worker->user !== null\n            && (bool) $worker->user->is_active\n            && $bookingDateTime !== null\n            && $worker->isAvailableAt($bookingDateTime)\n            && $depositService->isWorkerEligibleForDispatch($worker);\n    }\n"""
          new = """    private function isDispatchable(\n        Worker $worker,\n        CleaningBooking $booking,\n        ?Carbon $bookingDateTime,\n        DepositService $depositService,\n        WorkerBookingScheduleConflictService $scheduleConflictService,\n    ): bool {\n        if (\n            $worker->user === null\n            || ! (bool) $worker->user->is_active\n            || ! $depositService->isWorkerEligibleForDispatch($worker)\n        ) {\n            return false;\n        }\n\n        if ((string) $booking->property_type !== 'event_assistance') {\n            return $bookingDateTime !== null && $worker->isAvailableAt($bookingDateTime);\n        }\n\n        $sessions = CleaningBookingSession::query()\n            ->where('cleaning_booking_id', $booking->id)\n            ->whereNotIn('status', CleaningBookingSessionStatus::terminalValues())\n            ->orderBy('sequence')\n            ->get();\n\n        if ($sessions->isEmpty()) {\n            return $bookingDateTime !== null && $worker->isAvailableAt($bookingDateTime);\n        }\n\n        foreach ($sessions as $session) {\n            $startsAt = $session->startsAt();\n            if ($startsAt === null || ! $worker->isAvailableAt($startsAt)) {\n                return false;\n            }\n        }\n\n        $scheduleConflictService->forgetWorker($worker);\n\n        return ! $scheduleConflictService->hasConflict($worker, $booking);\n    }\n"""
          replace(path, old, new)

          # 3) PATCH event schedules use the same validation contract as create/estimate.
          path = 'Modules/User/app/Http/Requests/UserCleaningOrderUpdateRequest.php'
          replace(path,
              "use Modules\\Cleaning\\Models\\CleaningBooking;\n",
              "use Modules\\Cleaning\\Models\\CleaningBooking;\nuse Modules\\User\\Http\\Requests\\Concerns\\ValidatesEventAssistanceSchedule;\n")
          replace(path,
              "final class UserCleaningOrderUpdateRequest extends FormRequest\n{\n",
              "final class UserCleaningOrderUpdateRequest extends FormRequest\n{\n    use ValidatesEventAssistanceSchedule;\n\n")
          replace(path,
              "            'scheduledTime' => ['sometimes', 'date_format:H:i'],\n",
              "            'scheduledTime' => ['sometimes', 'date_format:H:i'],\n            ...$this->eventAssistanceScheduleRules($isEventAssistance),\n")
          replace(path,
              "        $validator->after(function (Validator $validator): void {\n            $assignmentMode = $this->normalizedAssignmentMode();\n",
              "        $validator->after(function (Validator $validator): void {\n            $this->validateEventAssistanceSchedule($validator);\n\n            $assignmentMode = $this->normalizedAssignmentMode();\n")
          old = """    private function isEventAssistanceContext(): bool\n    {\n        if (mb_strtolower((string) $this->input('propertyType')) === UserCleaningOrderEstimationService::EVENT_ASSISTANCE_PROPERTY_TYPE) {\n            return true;\n        }\n\n        return $this->shouldValidateEventPayload();\n    }\n"""
          new = """    private function isEventAssistanceContext(): bool\n    {\n        if (mb_strtolower((string) $this->input('propertyType')) === UserCleaningOrderEstimationService::EVENT_ASSISTANCE_PROPERTY_TYPE) {\n            return true;\n        }\n\n        $bookingId = $this->route('order');\n        if (\n            is_numeric($bookingId)\n            && CleaningBooking::query()\n                ->whereKey((int) $bookingId)\n                ->where('property_type', UserCleaningOrderEstimationService::EVENT_ASSISTANCE_PROPERTY_TYPE)\n                ->exists()\n        ) {\n            return true;\n        }\n\n        return $this->shouldValidateEventPayload();\n    }\n"""
          replace(path, old, new)

          # 4) Replace an event schedule atomically only before acceptance/execution.
          path = 'Modules/User/app/Services/EventAssistanceScheduleService.php'
          replace(path,
              "use Carbon\\CarbonImmutable;\n",
              "use Carbon\\CarbonImmutable;\nuse Illuminate\\Support\\Facades\\DB;\nuse Illuminate\\Validation\\ValidationException;\n")
          replace(path,
              "use Modules\\Cleaning\\Enums\\CleaningBookingSessionStatus;\n",
              "use Modules\\Cleaning\\Enums\\CleaningBookingSessionStatus;\nuse Modules\\Cleaning\\Enums\\CleaningBookingWorkerAssignmentStatus;\n")
          marker = """    private function normalizeHours(float $hours): float\n    {\n        return ceil(max(1.0, $hours) * 2) / 2;\n    }\n"""
          methods = """    public function assertEditable(CleaningBooking $booking): void\n    {\n        if ((string) $booking->property_type !== UserCleaningOrderEstimationService::EVENT_ASSISTANCE_PROPERTY_TYPE) {\n            throw ValidationException::withMessages([\n                'schedule' => ['Only event-assistance bookings can use an event execution schedule.'],\n            ]);\n        }\n\n        $parentStatus = $booking->status?->value ?? (string) $booking->status;\n        if ($parentStatus !== 'pending') {\n            throw ValidationException::withMessages([\n                'schedule' => ['Event days cannot be changed after worker acceptance or execution has begun.'],\n            ]);\n        }\n\n        if ($booking->workerAssignments()\n            ->whereIn('status', CleaningBookingWorkerAssignmentStatus::acceptedValues())\n            ->exists()) {\n            throw ValidationException::withMessages([\n                'schedule' => ['Event days cannot be changed after a worker has accepted the booking.'],\n            ]);\n        }\n\n        $sessions = CleaningBookingSession::query()\n            ->where('cleaning_booking_id', $booking->id)\n            ->with('workerAssignments')\n            ->orderBy('sequence')\n            ->get();\n\n        foreach ($sessions as $session) {\n            $status = $session->status?->value ?? (string) $session->status;\n            $hasAcceptedWorker = $session->workerAssignments\n                ->contains(static fn ($assignment): bool => $assignment->isAccepted());\n\n            if (\n                $status !== CleaningBookingSessionStatus::Scheduled->value\n                || $hasAcceptedWorker\n                || $session->started_travel_at !== null\n                || $session->arrived_at !== null\n                || $session->customer_confirmed_at !== null\n                || $session->work_started_at !== null\n                || $session->work_finished_at !== null\n            ) {\n                throw ValidationException::withMessages([\n                    'schedule' => ['Event days cannot be changed after worker acceptance or execution has begun.'],\n                ]);\n            }\n        }\n    }\n\n    /** @param array<string, mixed> $validated */\n    public function replaceSchedule(CleaningBooking $booking, array $validated): CleaningBooking\n    {\n        return DB::transaction(function () use ($booking, $validated): CleaningBooking {\n            $locked = CleaningBooking::query()\n                ->whereKey($booking->id)\n                ->lockForUpdate()\n                ->firstOrFail();\n\n            $this->assertEditable($locked);\n            $plan = $this->resolve($validated);\n\n            if ($plan === null) {\n                throw ValidationException::withMessages([\n                    'schedule' => ['At least one event execution day is required.'],\n                ]);\n            }\n\n            $pricing = $this->quote(\n                plan: $plan,\n                propertyType: (string) $locked->property_type,\n                propertyDetails: (array) ($locked->property_details ?? []),\n                addressLatitude: $locked->address_latitude,\n                addressLongitude: $locked->address_longitude,\n                preferredWorkerId: $locked->resolvedAssignmentMode() === 'preferred_worker'\n                    ? $locked->preferred_worker_id\n                    : null,\n                requiredWorkers: max(1, (int) $locked->number_of_workers),\n            );\n\n            $grossTotal = round((float) $pricing['totalPrice'], 2);\n            $discount = min(\n                $grossTotal,\n                max(0.0, (float) ($locked->discount_amount ?? 0)),\n            );\n\n            CleaningBookingSession::query()\n                ->where('cleaning_booking_id', $locked->id)\n                ->delete();\n\n            $locked->forceFill([\n                'property_details' => $this->withAggregateHours(\n                    (array) ($locked->property_details ?? []),\n                    $plan,\n                ),\n                'estimated_hours' => $plan['totalHours'],\n                'total_hours' => $plan['totalHours'],\n                'scheduled_date' => $plan['firstDate'],\n                'scheduled_time' => $plan['firstTime'],\n                'base_price' => $pricing['basePrice'],\n                'addons_total' => $pricing['addonsTotal'],\n                'travel_fee' => $pricing['travelFee'],\n                'travel_distance_km' => $pricing['distanceKm'],\n                'admin_margin_amount' => $pricing['adminMargin'],\n                'is_pricing_final' => $pricing['isPricingFinal'],\n                'subtotal_before_discount' => $discount > 0 || $locked->subtotal_before_discount !== null\n                    ? $grossTotal\n                    : null,\n                'discount_amount' => $discount,\n                'total_price' => round($grossTotal - $discount, 2),\n            ])->saveQuietly();\n\n            $locked = $locked->fresh() ?? $locked;\n            $this->createSessions($locked, $plan, $pricing);\n\n            return $locked->fresh() ?? $locked;\n        });\n    }\n\n""" + marker
          replace(path, marker, methods)

          # 5) Wire schedule replacement into the customer PATCH endpoint.
          path = 'Modules/User/app/Http/Controllers/API/UserCleaningOrderUpdateController.php'
          replace(path,
              "use Illuminate\\Http\\JsonResponse;\n",
              "use Illuminate\\Http\\JsonResponse;\nuse Illuminate\\Support\\Facades\\DB;\n")
          replace(path,
              "use Modules\\User\\Services\\UserCleaningOrderEstimationService;\n",
              "use Modules\\User\\Services\\EventAssistanceScheduleService;\nuse Modules\\User\\Services\\UserCleaningOrderEstimationService;\n")
          old = """    public function __invoke(UserCleaningOrderUpdateRequest $request, int $order, UserCleaningOrderService $service): JsonResponse\n    {\n        $model = CleaningBooking::query()\n            ->where('customer_id', $request->user()->id)\n            ->findOrFail($order);\n\n        $validated = $this->withEventWorkerCount($request->validated(), $model);\n        $updated = $service->update($model, $validated);\n"""
          new = """    public function __invoke(\n        UserCleaningOrderUpdateRequest $request,\n        int $order,\n        UserCleaningOrderService $service,\n        EventAssistanceScheduleService $eventSchedule,\n    ): JsonResponse {\n        $model = CleaningBooking::query()\n            ->where('customer_id', $request->user()->id)\n            ->findOrFail($order);\n\n        $validated = $this->withEventWorkerCount($request->validated(), $model);\n        $updated = DB::transaction(function () use ($model, $validated, $service, $eventSchedule): CleaningBooking {\n            $schedule = $validated['schedule'] ?? null;\n            unset($validated['schedule']);\n\n            if (is_array($schedule)) {\n                $eventSchedule->assertEditable($model);\n            }\n\n            $updated = $service->update($model, $validated);\n\n            if (is_array($schedule)) {\n                $updated = $eventSchedule->replaceSchedule($updated, ['schedule' => $schedule]);\n            }\n\n            return $updated;\n        });\n"""
          replace(path, old, new)

          # 6) Expose authoritative customer schedule edit capability.
          path = 'Modules/Cleaning/app/Services/CleaningBookingSchedulePresenter.php'
          replace(path,
              "        $firstDate = $sessions->min('scheduled_date');\n        $lastDate = $sessions->max('scheduled_date');\n\n        return [\n",
              "        $firstDate = $sessions->min('scheduled_date');\n        $lastDate = $sessions->max('scheduled_date');\n        $canReschedule = $this->eventScheduleCanReschedule($booking, $sessions, $viewerWorker);\n\n        return [\n")
          text = Path(path).read_text()
          text = text.replace(
              "$this->sessionPayload($next, $viewerWorker)",
              "$this->sessionPayload($next, $viewerWorker, $canReschedule)",
          )
          text = text.replace(
              "$this->sessionPayload($session, $viewerWorker)",
              "$this->sessionPayload($session, $viewerWorker, $canReschedule)",
          )
          text = text.replace(
              "private function sessionPayload(CleaningBookingSession $session, ?Worker $viewerWorker): array",
              "private function sessionPayload(CleaningBookingSession $session, ?Worker $viewerWorker, bool $canReschedule): array",
          )
          needle = "            'canCancel' => $canCancel,\n"
          if needle not in text:
              raise SystemExit('presenter canCancel insertion point missing')
          text = text.replace(needle, needle + "            'canReschedule' => $isCustomerView && $canReschedule,\n", 1)
          helper_marker = """    private function status(CleaningBookingSession $session): string\n    {\n"""
          helper = """    private function eventScheduleCanReschedule(CleaningBooking $booking, $sessions, ?Worker $viewerWorker): bool\n    {\n        if (\n            $viewerWorker instanceof Worker\n            || (string) $booking->property_type !== 'event_assistance'\n            || ($booking->status?->value ?? (string) $booking->status) !== 'pending'\n        ) {\n            return false;\n        }\n\n        if ($booking->workerAssignments()\n            ->whereIn('status', \\Modules\\Cleaning\\Enums\\CleaningBookingWorkerAssignmentStatus::acceptedValues())\n            ->exists()) {\n            return false;\n        }\n\n        foreach ($sessions as $session) {\n            if (! $session instanceof CleaningBookingSession) {\n                continue;\n            }\n\n            if (\n                $this->status($session) !== CleaningBookingSessionStatus::Scheduled->value\n                || $session->started_travel_at !== null\n                || $session->arrived_at !== null\n                || $session->customer_confirmed_at !== null\n                || $session->work_started_at !== null\n                || $session->work_finished_at !== null\n                || $session->workerAssignments->contains(\n                    static fn (CleaningBookingSessionWorkerAssignment $assignment): bool => $assignment->isAccepted(),\n                )\n            ) {\n                return false;\n            }\n        }\n\n        return $sessions->isNotEmpty();\n    }\n\n""" + helper_marker
          if helper_marker not in text:
              raise SystemExit('presenter helper insertion point missing')
          text = text.replace(helper_marker, helper, 1)
          Path(path).write_text(text)

          # 7) Acceptance test: generic sessions keep partial selection; event API rejects it.
          path = 'tests/Feature/Cleaning/CleaningBookingSessionAcceptanceTest.php'
          replace(path,
              "use App\\Models\\Worker;\n",
              "use App\\Models\\Worker;\nuse Laravel\\Sanctum\\Sanctum;\n")
          replace(path,
              "function makeSessionBooking(): CleaningBooking\n{\n    return CleaningBooking::factory()->create([\n",
              "function makeSessionBooking(string $propertyType = 'villa'): CleaningBooking\n{\n    return CleaningBooking::factory()->create([\n")
          replace(path,
              "        'property_type' => 'event_assistance',\n",
              "        'property_type' => $propertyType,\n")
          insert_before = """function makeSessionWorker(): Worker\n{\n"""
          test = """it('rejects partial acceptance for a multi-day event through the public API', function (): void {\n    $worker = makeSessionWorker();\n    $booking = makeSessionBooking('event_assistance');\n    $first = makeExecutionSession($booking, 1, now()->addDay()->toDateString(), '10:00', 1.0);\n    makeExecutionSession($booking, 2, now()->addDays(2)->toDateString(), '10:00', 1.0);\n\n    Sanctum::actingAs($worker->user);\n\n    $this->postJson(\n        \"/api/v1/cleaning-bookings/{$booking->id}/sessions/accept-selected\",\n        ['sessionIds' => [$first->id]],\n    )\n        ->assertUnprocessable()\n        ->assertJsonPath('data.acceptance.allAccepted', false)\n        ->assertJsonPath('data.acceptance.acceptedSessionIds', [])\n        ->assertJsonPath('data.acceptance.rejected.0.reasonCode', 'event_all_days_required');\n\n    expect($first->workerAssignments()->count())->toBe(0);\n});\n\n""" + insert_before
          replace(path, insert_before, test)

          # 8) Event schedule PATCH tests.
          path = 'tests/Feature/UserModule/EventAssistanceMultiDayScheduleTest.php'
          replace(path,
              "use App\\Models\\User;\n",
              "use App\\Models\\User;\nuse App\\Models\\Worker;\n")
          replace(path,
              "use Modules\\Cleaning\\Models\\CleaningBookingSession;\n",
              "use Modules\\Cleaning\\Models\\CleaningBookingSession;\nuse Modules\\Cleaning\\Models\\CleaningBookingSessionWorkerAssignment;\n")
          replace(path,
              "use function Pest\\Laravel\\postJson;\n",
              "use function Pest\\Laravel\\patchJson;\nuse function Pest\\Laravel\\postJson;\n")
          append = r'''

it('allows replacing event days before acceptance and locks the schedule after a worker accepts', function (): void {
    $payload = multiDayEventPayload();
    $create = postJson('/api/v1/user/cleaning/orders', $payload)->assertCreated();
    $bookingId = (int) $create->json('order.id');

    $replacement = [
        'mode' => 'multi_day',
        'sessions' => [
            [
                'date' => now(config('app.timezone'))->addDays(3)->toDateString(),
                'time' => '09:30',
                'hours' => 2.5,
            ],
            [
                'date' => now(config('app.timezone'))->addDays(5)->toDateString(),
                'time' => '14:00',
                'hours' => 4,
            ],
        ],
    ];

    patchJson("/api/v1/user/cleaning/orders/{$bookingId}", [
        'schedule' => $replacement,
    ])->assertOk();

    $booking = CleaningBooking::query()->findOrFail($bookingId);
    $sessions = CleaningBookingSession::query()
        ->where('cleaning_booking_id', $bookingId)
        ->orderBy('sequence')
        ->get();

    expect($sessions)->toHaveCount(2)
        ->and((float) $booking->total_hours)->toBe(6.5)
        ->and((float) ($booking->property_details['hours'] ?? 0))->toBe(6.5)
        ->and($booking->scheduled_date?->toDateString())->toBe($replacement['sessions'][0]['date'])
        ->and((string) $booking->scheduled_time)->toBe('09:30');

    getJson("/api/v1/cleaning-bookings/{$bookingId}/schedule")
        ->assertOk()
        ->assertJsonPath('data.schedule.daysCount', 2)
        ->assertJsonPath('data.schedule.sessions.0.canReschedule', true)
        ->assertJsonPath('data.schedule.sessions.1.canReschedule', true);

    $worker = Worker::factory()->create();
    CleaningBookingSessionWorkerAssignment::query()->create([
        'cleaning_booking_session_id' => $sessions->first()->id,
        'worker_id' => $worker->id,
        'status' => 'accepted_waiting_for_order_start',
        'accepted_at' => now(),
        'currency' => 'SYP',
    ]);

    getJson("/api/v1/cleaning-bookings/{$bookingId}/schedule")
        ->assertOk()
        ->assertJsonPath('data.schedule.sessions.0.canReschedule', false)
        ->assertJsonPath('data.schedule.sessions.1.canReschedule', false);

    patchJson("/api/v1/user/cleaning/orders/{$bookingId}", [
        'schedule' => $replacement,
    ])
        ->assertUnprocessable()
        ->assertJsonValidationErrors('schedule');
});
'''
          p = Path(path)
          p.write_text(p.read_text() + append)

          # 9) Dispatch regression: conflict on only the second event day hides the request.
          path = 'tests/Feature/Cleaning/CleaningNewOrderDispatchTest.php'
          replace(path,
              "use Modules\\Cleaning\\Models\\CleaningBooking;\n",
              "use Modules\\Cleaning\\Models\\CleaningBooking;\nuse Modules\\Cleaning\\Models\\CleaningBookingSession;\nuse Modules\\Cleaning\\Models\\CleaningBookingSessionWorkerAssignment;\n")
          append = r'''

it('does not dispatch a multi-day event when the worker conflicts on only one event day', function (): void {
    Notification::fake();
    Event::fake([CleaningBookingCreated::class]);

    CleaningDepositSetting::query()->create([
        'minimum_deposit_amount' => 0,
        'default_max_negative_balance' => 100000,
        'restriction_threshold_percent' => 100,
        'allowance_warning_threshold_percent' => 10,
        'is_enabled' => true,
        'trust_reject_after_accept_penalty' => 10,
        'trust_minimum_for_dispatch' => 0,
    ]);

    $firstAt = now()->addDays(2)->setTime(10, 0);
    $secondAt = now()->addDays(3)->setTime(10, 0);
    $workingHours = [];
    foreach (['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'] as $day) {
        $workingHours[$day] = [
            'available' => true,
            'data' => [['00:00' => '23:59']],
        ];
    }

    $workerUser = User::factory()->create(['is_active' => true]);
    $worker = Worker::factory()->create([
        'user_id' => $workerUser->id,
        'trust_score' => 100,
        'is_active' => true,
        'is_suspended' => false,
        'default_working_hours' => $workingHours,
    ]);
    CleaningWorkerDeposit::query()->create([
        'worker_id' => $worker->id,
        'current_balance' => 100000,
        'deposited_total' => 100000,
        'withdrawn_total' => 0,
        'minimum_required' => 0,
        'max_negative_balance' => 100000,
        'is_active' => true,
    ]);

    $candidate = CleaningBooking::factory()->create([
        'worker_id' => null,
        'preferred_worker_id' => null,
        'assignment_mode' => 'open_count',
        'status' => CleaningBookingStatus::Pending->value,
        'property_type' => 'event_assistance',
        'gender_preference' => 'any',
        'scheduled_date' => $firstAt->toDateString(),
        'scheduled_time' => $firstAt->format('H:i'),
        'estimated_hours' => 4,
        'total_hours' => 4,
        'base_price' => 4000,
        'addons_total' => 0,
        'admin_margin_amount' => 0,
        'total_price' => 4000,
        'number_of_workers' => 1,
    ]);
    foreach ([[$firstAt, 1], [$secondAt, 2]] as [$startsAt, $sequence]) {
        CleaningBookingSession::query()->create([
            'cleaning_booking_id' => $candidate->id,
            'sequence' => $sequence,
            'session_type' => 'event_assistance',
            'calculation_mode' => 'hours',
            'scheduled_date' => $startsAt->toDateString(),
            'scheduled_time' => $startsAt->format('H:i'),
            'duration_hours' => 2,
            'required_workers' => 1,
            'coverage_status' => 'searching',
            'status' => 'scheduled',
            'base_price' => 2000,
            'admin_margin_amount' => 0,
            'total_price' => 2000,
        ]);
    }

    $otherBooking = CleaningBooking::factory()->create([
        'status' => CleaningBookingStatus::WorkerAssigned->value,
        'worker_id' => null,
        'scheduled_date' => $secondAt->toDateString(),
