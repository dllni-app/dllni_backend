name: Cleaning Suite

on:
  push:
    branches:
      - feature/cleaning-suite-main
    paths:
      - '.github/workflows/cleaning-suite.yml'

permissions:
  contents: write

jobs:
  finish-event-phase-one:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply event phase-one backend changes
        run: python3 .github/scripts/finish_event_phase_one.py

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, bcmath, intl, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Format modified sources
        run: |
          vendor/bin/pint \
            app/Jobs/NotifyEligibleWorkersNewOrderJob.php \
            Modules/Cleaning/app/Http/Controllers/API/CleaningBookingSessionAcceptanceController.php \
            Modules/Cleaning/app/Services/CleaningBookingSchedulePresenter.php \
            Modules/User/app/Http/Controllers/API/UserCleaningOrderUpdateController.php \
            Modules/User/app/Http/Requests/UserCleaningOrderUpdateRequest.php \
            Modules/User/app/Services/EventAssistanceScheduleService.php \
            tests/Feature/Cleaning/CleaningBookingSessionAcceptanceTest.php \
            tests/Feature/Cleaning/CleaningNewOrderDispatchTest.php \
            tests/Feature/UserModule/EventAssistanceMultiDayScheduleTest.php

      - name: Prepare application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Migrate database
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Run focused event and session tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          php artisan test \
            tests/Feature/Cleaning/CleaningBookingSessionAcceptanceTest.php \
            tests/Feature/Cleaning/CleaningNewOrderDispatchTest.php \
            tests/Feature/Cleaning/CleaningBookingSessionLifecycleTest.php \
            tests/Feature/Cleaning/CleaningBookingSessionCancellationAndSosTest.php \
            tests/Feature/UserModule/EventAssistanceMultiDayScheduleTest.php \
            tests/Feature/UserModule/EventAssistancePreviousWorkersScheduleTest.php

      - name: Restore check-only CI and commit implementation
        run: |
          git checkout e680433e44cec89b2579a4c5bee33d04fb42113d -- .github/workflows/cleaning-suite.yml
          git rm .github/scripts/finish_event_phase_one.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(cleaning): enforce multi-day event phase-one rules'
          git push
