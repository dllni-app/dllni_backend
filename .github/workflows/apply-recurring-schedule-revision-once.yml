name: Apply Recurring Schedule Revision Once

on:
  push:
    branches:
      - feature/cleaning-suite-main
    paths:
      - '.github/workflows/apply-recurring-schedule-revision-once.yml'
      - 'scripts/apply_recurring_schedule_revision_patch.py'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cleaning-suite-main
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, bcmath, intl, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply recurring schedule revision patch
        run: python scripts/apply_recurring_schedule_revision_patch.py
      - name: Format changes
        run: |
          vendor/bin/pint \
            Modules/Cleaning/app/Enums/CleaningBookingSessionStatus.php \
            Modules/Cleaning/app/Services/CleaningBookingSchedulePresenter.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionFinancialAggregationService.php \
            Modules/User/app/Http/Requests/UserRecurringCleaningScheduleRevisionRequest.php \
            Modules/User/app/Services/RecurringCleaningScheduleRevisionService.php \
            Modules/User/app/Http/Controllers/API/UserRecurringCleaningScheduleRevisionController.php \
            Modules/User/routes/api.php \
            tests/Feature/UserModule/RecurringCleaningScheduleRevisionTest.php
      - name: Prepare application
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force
      - name: Run recurring revision and regression tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        shell: bash
        run: |
          set -o pipefail
          php artisan test \
            tests/Feature/UserModule/RecurringCleaningScheduleRevisionTest.php \
            tests/Feature/UserModule/RecurringCleaningScheduleTest.php \
            tests/Feature/Cleaning/RecurringCleaningWorkerContinuityTest.php \
            tests/Feature/Cleaning/RecurringCleaningPreferredWorkerFallbackTest.php \
            tests/Feature/UserModule/EventAssistanceMultiDayScheduleTest.php \
            2>&1 | tee recurring-schedule-revision-test.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recurring-schedule-revision-diagnostics
          path: recurring-schedule-revision-test.log
          if-no-files-found: ignore
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Modules/Cleaning/app/Enums/CleaningBookingSessionStatus.php \
            Modules/Cleaning/app/Services/CleaningBookingSchedulePresenter.php \
            Modules/Cleaning/app/Services/CleaningBookingSessionFinancialAggregationService.php \
            Modules/User/app/Http/Requests/UserRecurringCleaningScheduleRevisionRequest.php \
            Modules/User/app/Services/RecurringCleaningScheduleRevisionService.php \
            Modules/User/app/Http/Controllers/API/UserRecurringCleaningScheduleRevisionController.php \
            Modules/User/routes/api.php \
            tests/Feature/UserModule/RecurringCleaningScheduleRevisionTest.php
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(cleaning): revise future recurring schedule with reconfirmation"
          git push origin HEAD:feature/cleaning-suite-main
