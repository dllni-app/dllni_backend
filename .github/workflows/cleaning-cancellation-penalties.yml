name: Cleaning Cancellation Penalties

on:
  pull_request:
    paths:
      - 'Modules/Cleaning/app/Observers/CleaningBookingCancellationAuditObserver.php'
      - 'Modules/Cleaning/app/Services/CleaningCancellationFinancialPenaltyService.php'
      - 'app/Filament/Resources/CleaningBookings/Pages/ViewCleaningBooking.php'
      - 'app/Filament/Resources/CleaningFinancialPenalties/**'
      - 'app/Models/CleaningFinancialPenalty.php'
      - 'app/Models/CleaningFinancialSetting.php'
      - 'app/Notifications/Cleaning/CleaningFinancialPenaltyNotification.php'
      - 'database/migrations/2026_08_21_204500_extend_cleaning_financial_penalties_for_automatic_review.php'
      - 'tests/Feature/Cleaning/AutomaticCancellationFinancialPenaltyTest.php'
      - '.github/workflows/cleaning-cancellation-penalties.yml'

jobs:
  cancellation-penalties:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, bcmath, intl, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Migrate database
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Check formatting
        run: |
          vendor/bin/pint --test \
            Modules/Cleaning/app/Observers/CleaningBookingCancellationAuditObserver.php \
            Modules/Cleaning/app/Services/CleaningCancellationFinancialPenaltyService.php \
            app/Filament/Resources/CleaningBookings/Pages/ViewCleaningBooking.php \
            app/Filament/Resources/CleaningFinancialPenalties \
            app/Models/CleaningFinancialPenalty.php \
            app/Models/CleaningFinancialSetting.php \
            app/Notifications/Cleaning/CleaningFinancialPenaltyNotification.php \
            database/migrations/2026_08_21_204500_extend_cleaning_financial_penalties_for_automatic_review.php \
            tests/Feature/Cleaning/AutomaticCancellationFinancialPenaltyTest.php

      - name: Run cancellation penalty tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test tests/Feature/Cleaning/AutomaticCancellationFinancialPenaltyTest.php
