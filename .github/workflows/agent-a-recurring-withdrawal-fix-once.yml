name: Agent A Recurring Withdrawal Fix Once

on:
  push:
    branches:
      - feature/cleaning-suite-agent-a-closeout
    paths:
      - '.github/workflows/agent-a-recurring-withdrawal-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exclude released assignment from recurring coverage recomputation
        shell: python
        run: |
          from pathlib import Path
          path = Path('Modules/Cleaning/app/Services/CleaningBookingSessionCancellationService.php')
          text = path.read_text(encoding='utf-8')
          old = """            $acceptedCount = CleaningBookingSessionWorkerAssignment::query()\n                ->where('cleaning_booking_session_id', $locked->id)\n                ->whereIn('status', CleaningBookingWorkerAssignmentStatus::acceptedValues())\n                ->count();"""
          new = """            $acceptedCount = CleaningBookingSessionWorkerAssignment::query()\n                ->where('cleaning_booking_session_id', $locked->id)\n                ->whereKeyNot($assignment->getKey())\n                ->whereIn('status', CleaningBookingWorkerAssignmentStatus::acceptedValues())\n                ->count();"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one withdrawal coverage query, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Modules/Cleaning/app/Services/CleaningBookingSessionCancellationService.php
          git commit -m "fix(cleaning): reopen recurring session after worker withdrawal"
          git push origin HEAD:feature/cleaning-suite-agent-a-closeout
