<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALNADHA Commerce — Phase 1 UX Review</title>
<style>
@font-face{font-family:Cairo;src:local("Cairo")}*{box-sizing:border-box}body{margin:0;background:#e9ecf2;color:#182232;font-family:Cairo,"Segoe UI",Tahoma,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #83a5ff;outline-offset:2px}
:root{--navy:#172554;--accent:#A63C66;--soft:#f9ecf1;--surface:#fff;--muted:#697386;--border:#E0E5EB;--bg:#F6F7F9}
body[data-section=sm]{--accent:#168A67;--soft:#eaf7f0}
.workspace{display:grid;grid-template-columns:minmax(250px,295px) 1fr;min-height:100vh;direction:ltr}.rail{background:#fff;border-right:1px solid #d9deea;padding:25px;direction:rtl;max-height:100vh;overflow:auto}.rail h1{font-size:20px;margin:0 0 7px;color:#172554}.rail p{font-size:12px;color:var(--muted);line-height:1.8}.rail label{display:block;margin:16px 0 7px;font-weight:800;font-size:12px}.rail select{width:100%;border:1px solid var(--border);border-radius:12px;padding:10px;background:white}.rail button{display:block;width:100%;text-align:right;border:1px solid transparent;background:transparent;border-radius:10px;padding:9px 11px;margin:2px 0;color:#26334d}.rail button:hover,.rail button.active{background:#eef1f9;color:var(--navy);font-weight:800}.rail .group{border-top:1px solid var(--border);margin-top:15px;padding-top:12px}
.stage{display:flex;justify-content:center;align-items:flex-start;padding:32px 22px 90px;direction:rtl}.device{width:390px;max-width:100%;min-height:844px;background:var(--bg);border:8px solid #1d2436;border-radius:36px;box-shadow:0 30px 60px #15234424;overflow:hidden;position:relative}.status{height:26px;background:#fff;text-align:center;font:700 12px Arial;padding:6px;color:#182232}.content{min-height:710px;padding-bottom:118px}.head{padding:17px 16px 12px;background:#fff}.headline{display:flex;align-items:center;justify-content:space-between}.head h2{margin:0;font-size:22px;color:#182232}.sub{font-size:12px;color:var(--muted)}.icon-btn{border:1px solid var(--border);background:#fff;width:44px;height:44px;border-radius:12px;color:var(--navy);font-size:19px}.location{display:flex;justify-content:space-between;align-items:center;padding:10px 0 0}.location button{background:transparent;border:0;color:var(--navy);font-weight:700}
.search{margin-top:14px;border:1px solid var(--border);background:#f6f7f9;border-radius:13px;display:flex;align-items:center;gap:8px;padding:0 12px;height:52px}.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:#182232}.search span{color:var(--accent)}.pad{padding:15px 16px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px}.section-head h3{margin:0;font-size:18px}.link{color:var(--accent);border:0;background:none;font-size:12px;font-weight:800}.chips{display:flex;gap:8px;overflow-x:auto;padding:3px 0 13px}.chip{border:1px solid var(--border);background:white;border-radius:100px;padding:9px 14px;white-space:nowrap;color:#253247}.chip.sel{background:var(--soft);color:var(--accent);border-color:var(--accent);font-weight:800}.banner{border-radius:18px;background:linear-gradient(120deg,var(--accent),#172554);color:#fff;padding:20px;min-height:130px}.banner strong{font-size:20px;display:block}.banner p{margin:5px 0;font-size:12px;opacity:.9}.card{border:1px solid var(--border);border-radius:16px;background:#fff;padding:13px;margin-bottom:12px}.merchant{display:flex;align-items:center;gap:12px;cursor:pointer}.thumb{display:grid;place-items:center;flex:0 0 86px;height:84px;border-radius:12px;font-size:36px;background:var(--soft)}.merchant .meta{flex:1}.merchant h4,.product h4{margin:0 0 4px;font-size:16px}.merchant small,.product small{display:block;color:var(--muted);font-size:12px;line-height:1.8}.rating{color:#9d6123;font-size:12px}.product{display:flex;align-items:center;gap:12px}.product .meta{flex:1}.price{font-size:17px;font-weight:900;color:#182232;margin-top:6px}.add{background:var(--soft);color:var(--accent);border:1px solid #e7d6df;border-radius:12px;min-width:46px;height:45px;font-weight:900}.grid-products{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{display:block;margin:0}.tile .thumb{width:100%;height:120px}.tile h4{font-size:13px;min-height:42px;margin:10px 0 3px}.tile .price{font-size:15px}.tile .add{width:100%;margin-top:6px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--border);position:absolute;bottom:0;left:0;right:0;height:70px}.tabs button{border:0;background:transparent;color:var(--muted);font-size:12px}.tabs button.on{color:var(--accent);font-weight:900}.floating{position:absolute;bottom:77px;left:12px;right:12px;background:var(--navy);color:white;padding:13px 16px;border:0;border-radius:14px;display:flex;justify-content:space-between;font-weight:800}.main-btn{width:100%;height:52px;border:0;background:var(--navy);border-radius:13px;color:#fff;font-weight:900}.muted-btn{background:#fff;border:1px solid var(--border);color:var(--navy);border-radius:12px;padding:12px;font-weight:700}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.divider{height:1px;background:var(--border);margin:12px 0}.summary .row{padding:7px 0}.summary strong{font-weight:900}.qty{display:flex;align-items:center;gap:12px}.qty button{width:36px;height:36px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--navy)}.sheet{background:#fff;border-radius:20px;padding:17px;margin:12px 16px;border:1px solid var(--border)}.field{border:1px solid var(--border);background:#fff;padding:12px;border-radius:12px;width:100%;min-height:48px;margin:5px 0 10px;color:#182232}.error{color:#a62446;background:#fff1f4;padding:13px;border-radius:12px;font-size:13px}.empty{text-align:center;padding:58px 17px;color:var(--muted)}.empty .emoji{font-size:45px}.step{border-right:3px solid var(--border);margin-right:12px;padding:0 20px 22px;position:relative}.step:before{content:"";position:absolute;right:-9px;top:0;width:15px;height:15px;background:#fff;border:2px solid var(--border);border-radius:50%}.step.done{border-color:var(--accent)}.step.done:before{background:var(--accent);border-color:var(--accent)}.note{font-size:11px;color:var(--muted);line-height:1.8}.tag{padding:4px 9px;border-radius:8px;background:var(--soft);color:var(--accent);font-size:11px}.footertext{margin-top:16px;border-top:1px solid var(--border);padding-top:14px;font-size:11px;line-height:1.7;color:var(--muted)}@media(max-width:750px){.workspace{display:block}.rail{max-height:none}.stage{padding:15px 5px 60px}.device{border-width:5px}}@media(prefers-reduced-motion:no-preference){button{transition:background .18s,transform .18s}button:active{transform:scale(.98)}}
</style></head>
<body data-section="rest"><div class="workspace"><aside class="rail"><h1>ALNADHA · Commerce UX</h1><p>Phase 1 · نموذج تفاعلي للمراجعة، بيانات توضيحية غير متصلة بالخادم. الواجهات الأصلية للتنظيف والصفحة المشتركة غير معدّلة.</p><label for="section">القسم</label><select id="section"><option value="rest">🍽 المطاعم — Berry</option><option value="sm">🛒 السوبرماركت — Green</option></select><div class="group"><label>الشاشات الرئيسية</label><div id="menu"></div></div><div class="group"><label>سيناريوهات وحالات</label><button onclick="show('loading')">◌ تحميل</button><button onclick="show('empty')">◇ نتائج فارغة</button><button onclick="show('error')">⚠ خطأ شبكة</button><button onclick="show('conflict')">↻ تغيّر السعر / المخزون</button><button onclick="show('recovery')">✓ استعادة طلب معلّق</button></div><p class="footertext">التنقل عبر الأزرار داخل الهاتف فعّال لغرض تقييم الـ UX، لكنه لا ينشئ طلبات حقيقية ولا يثبت صلاحية الأسعار.</p></aside><main class="stage"><div class="device"><div class="status">9:41 ▪ ▪ ▪ ◉</div><div id="screen" class="content"></div><div class="tabs" id="tabs"></div><div id="cartbar"></div></div></main></div>
<script>
const screens={rest:[['home','الرئيسية'],['discover','البحث والاكتشاف'],['offers','العروض'],['favorites','المفضلة'],['merchant','تفاصيل المطعم'],['product','تفاصيل الوجبة'],['cart','السلة'],['checkout','إتمام الطلب'],['success','تأكيد الطلب'],['tracking','تتبع الطلب'],['orders','طلباتي'],['group','الطلب الجماعي'],['vote','التصويت'],['lucky','الصندوق المحظوظ'],['reorder','إعادة الطلب'],['filters','الفلاتر'],['reviews','التقييمات']],sm:[['home','الرئيسية'],['discover','البحث والاكتشاف'],['offers','العروض'],['favorites','المفضلة'],['merchant','تفاصيل المتجر'],['product','تفاصيل المنتج'],['cart','السلة'],['checkout','إتمام الطلب'],['success','تأكيد الطلب'],['tracking','تتبع الطلب'],['orders','طلباتي'],['compare','مقارنة المنتجات'],['lists','قوائم التسوق'],['reorder','إعادة الطلب'],['filters','الفلاتر'],['alternatives','البدائل']]};let section='rest',page='home',qty=1,cart=0,fulfillment='delivery',scope='merchants',query='',filter='الكل',coupon='',note='',currentAddress='دمشق · المزة',stage='pending',selectedModifier='عادي',selectedAlternative='لا بديل',errorKind='network';const $=id=>document.getElementById(id),fmt=n=>Number(n).toFixed(2).replace(/\.00$/,'');const rest=[['بيت الشام','🍽','4.7','25–40 دقيقة'],['مذاق الشام','🍔','4.5','30–45 دقيقة'],['فرن الحارة','🍕','4.6','20–35 دقيقة']];const sm=[['سوبرماركت الندى','🛒','4.8','متاح الآن'],['متجر الأسرة','🥬','4.5','متاح الآن'],['ماركت المدينة','🍎','4.6','ساعات المتجر']];const items=()=>section==='rest'?[['شاورما دجاج','🌯',18500],['بيتزا خضار','🍕',32000],['برغر لحم','🍔',27000]]:[['حليب كامل الدسم · 1 لتر','🥛',9500.5],['تفاح أحمر · 1 كغ','🍎',12000],['خبز طازج · عبوة','🍞',5000]];
const title=()=>section==='rest'?'المطاعم':'السوبرماركت';const merchants=()=>section==='rest'?rest:sm;const tax=()=>0;const unit=()=>items()[0][2];const fee=()=>fulfillment==='delivery'?4500:0;const total=()=>unit()*cart+fee();const button=(label,dest,cls='muted-btn')=>`<button class="${cls}" onclick="show('${dest}')">${label}</button>`;const makeHeader=(label)=>`<header class="head"><div class="headline"><h2>${label}</h2><button class="icon-btn" aria-label="رجوع" onclick="show('home')">←</button></div><div class="currentAddress"><span class="sub">📍 ${currentAddress}</span><button onclick="changeLocation()">تغيير ◂</button></div>${['home','discover'].includes(page)?`<div class="search"><span>⌕</span><input aria-label="بحث" value="${query.replaceAll('"','&quot;')}" placeholder="${section==='rest'?'ابحث عن مطعم أو وجبة':'ابحث عن متجر أو منتج'}" oninput="query=this.value" onkeydown="if(event.key==='Enter')show('discover')"><button class="link" onclick="show('discover')">بحث</button></div>`:''}</header>`;
const chips=(list,choice,handler)=>`<div class="chips">${list.map(x=>`<button class="chip ${choice===x?'sel':''}" onclick="${handler}('${x}')">${x}</button>`).join('')}</div>`;
const merchantCards=()=>merchants().filter(m=>!query||m[0].includes(query)||scope!=='merchants').map((m,i)=>`<article class="card merchant" onclick="show('merchant')" tabindex="0" onkeydown="if(event.key==='Enter')show('merchant')"><div class="thumb">${m[1]}</div><div class="meta"><h4>${m[0]}</h4><small>${m[3]}</small><span class="rating">★ ${m[2]} · تقييمات موثقة فقط</span><small>${i===0?'عرض التفاصيل والرسوم عند تحديد العنوان':'رسوم التوصيل عند التسعير'}</small></div><span>‹</span></article>`).join('')||`<div class="empty">لا توجد نتائج مطابقة ${button('مسح البحث','home')}</div>`;
const productCards=()=>items().filter(x=>!query||x[0].includes(query)||scope!=='products').map((m,i)=>`<article class="card product"><div class="thumb">${m[1]}</div><div class="meta"><h4 onclick="show('product')">${m[0]}</h4><small>${section==='rest'?'مكونات وخيارات متاحة':'وحدة القياس وخيارات المنتج'}</small><div class="price">${fmt(m[2])} ل.س</div></div><button class="add" aria-label="إضافة ${m[0]}" onclick="${i===0?'add()':"show('product')"}">+</button></article>`).join('');
const productGrid=()=>`<div class="grid-products">${items().map(m=>`<article class="card tile"><div class="thumb">${m[1]}</div><h4>${m[0]}</h4><small>التفاصيل وخيارات المنتج</small><div class="price">${fmt(m[2])} ل.س</div><button class="add" onclick="show('product')">التفاصيل +</button></article>`).join('')}</div>`;
const money=()=>`<div class="card summary"><div class="row"><span>المنتجات</span><strong>${fmt(unit()*cart)} ل.س</strong></div><div class="row"><span>الخصم</span><span>0 ل.س</span></div><div class="row"><span>رسوم المتجر</span><span>0 ل.س</span></div><div class="row"><span>التوصيل</span><span>${fulfillment==='delivery'?'4,500 ل.س — توضيحي':'0 ل.س'}</span></div><div class="divider"></div><div class="row"><strong>الإجمالي التوضيحي</strong><strong>${fmt(total())} ل.س</strong></div><p class="note">أرقام نموذجية لتقييم العرض، وليست عرض سعر صالحًا للدفع. المبلغ النهائي في التطبيق يجب تأكيده من الخادم.</p></div>`;
function selectFilter(x){filter=x;render()}function changeLocation(){currentAddress=currentAddress.includes('المزة')?'دمشق · المالكي':'دمشق · المزة';render()}function add(){cart+=qty;show('cart')}function changeQty(d){qty=Math.max(1,qty+d);render()}function show(p){page=p;render()}function changeSection(s){section=s;document.body.dataset.section=s;page='home';cart=0;qty=1;query='';filter='الكل';$('section').value=s;render()}
function render(){document.body.dataset.section=section;const isRest=section==='rest';$('menu').innerHTML=screens[section].map(([k,v])=>`<button class="${page===k?'active':''}" onclick="show('${k}')">${v}</button>`).join('');const nav=[['home','الرئيسية','⌂'],['discover','اكتشف','⌕'],['offers','العروض','٪'],['favorites','المفضلة','♡']];$('tabs').innerHTML=nav.map(([id,n,ic])=>`<button class="${page===id?'on':''}" onclick="show('${id}')"><div style="font-size:19px">${ic}</div>${n}</button>`).join('');$('cartbar').innerHTML=cart>0&&!['cart','checkout','success','tracking'].includes(page)?`<button class="floating" onclick="show('cart')"><span>عرض السلة · ${cart} منتج</span><span>${fmt(unit()*cart)} ل.س</span></button>`:'';let x='';
switch(page){
case 'home':x=makeHeader(title())+`<div class="pad"><div class="section-head"><h3>التصنيفات</h3></div>${chips(isRest?['الكل','مشاوي','وجبات','بيتزا','حلويات']:['الكل','بقالة','خضار','ألبان','مخبوزات'],filter,'selectFilter')}<div class="banner"><strong>${isRest?'وجبتك المفضلة أقرب':'احتياجات البيت بسهولة'}</strong><p>اكتشف عروض التجار الحقيقية فقط</p><button class="muted-btn" onclick="show('offers')">تصفح العروض</button></div><div class="section-head"><h3>${isRest?'مطاعم قريبة منك':'متاجر قريبة منك'}</h3>${button('الكل','discover','link')}</div>${merchantCards()}<div class="section-head"><h3>${isRest?'اقتراحات من القائمة':'منتجات مميزة'}</h3></div>${isRest?productCards():productGrid()}${button(isRest?'الطلب الجماعي':'قوائم التسوق',isRest?'group':'lists')}</div>`;break;
case 'discover':x=makeHeader('اكتشف')+`<div class="pad">${chips(['merchants','products'],scope,'setScope')}<div class="row"><strong>نتائج البحث</strong>${button('⚙ الفلاتر','filters','link')}</div>${chips(['الكل','الأعلى تقييماً','الأقرب'],filter,'selectFilter')}${scope==='merchants'?merchantCards():productCards()}</div>`;break;
case 'merchant':x=makeHeader(isRest?'بيت الشام':'سوبرماركت الندى')+`<div class="pad"><div class="banner"><strong>${isRest?'بيت الشام':'سوبرماركت الندى'}</strong><p>المعلومات والتوفر يحددهما المتجر الفعلي</p></div><div class="card"><div class="row"><strong>★ 4.7 · التقييمات</strong>${button('عرض التفاصيل',isRest?'reviews':'merchant','link')}</div><p class="sub">ساعات العمل والتحضير ووسيلة الاستلام</p></div>${chips(isRest?['الكل','السندويشات','البيتزا']:['الكل','الألبان','الفواكه','الخبز'],filter,'selectFilter')}<div class="section-head"><h3>قائمة المنتجات</h3></div>${isRest?productCards():productGrid()}<div class="row">${button(isRest?'التصويت الجماعي':'مقارنة المنتجات',isRest?'vote':'compare')}${button('السلة','cart')}</div></div>`;break;
case 'product':x=makeHeader(isRest?'تفاصيل الوجبة':'تفاصيل المنتج')+`<div class="pad"><div class="thumb" style="height:220px;font-size:96px">${items()[0][1]}</div><h3>${items()[0][0]}</h3><p class="sub">${isRest?'اختر الإضافات المسموحة حسب القواعد الحالية':'معلومات العبوة والمخزون الفعلي من الخادم'}</p><div class="price">${fmt(unit())} ل.س</div><div class="sheet"><strong>التخصيص</strong><p class="note">مجموعة خيارات، الحد الأدنى والحد الأقصى يعرضان من API</p>${chips(isRest?['عادي','إضافي','بدون صوص']:['عادي','عبوة أخرى'],selectedModifier,'selectModifier')}</div>${!isRest?`<div class="sheet"><strong>البديل المفضل</strong>${chips(['لا بديل','اتصل بي','بديل معتمد'],selectedAlternative,'selectAlternative')}</div>`:''}<label>ملاحظة للمتجر</label><textarea class="field" rows="2" placeholder="اكتب ملاحظة اختيارية" onchange="note=this.value">${note}</textarea><div class="row"><div class="qty"><button onclick="changeQty(-1)">−</button><strong>${qty}</strong><button onclick="changeQty(1)">+</button></div><strong>${fmt(unit()*qty)} ل.س</strong></div><div style="margin-makeHeader:14px"><button class="main-btn" onclick="add()">إضافة إلى السلة — ${fmt(unit()*qty)} ل.س</button></div></div>`;break;
case 'cart':x=makeHeader('سلة المشتريات')+`<div class="pad"><h3>${isRest?'بيت الشام':'سوبرماركت الندى'}</h3>${cart? `<div class="card product"><div class="thumb">${items()[0][1]}</div><div class="meta"><h4>${items()[0][0]}</h4><small>الخيار: ${selectedModifier} · ${note||'بدون ملاحظات'}</small><div class="price">${fmt(unit()*cart)} ل.س</div><div class="qty"><button onclick="cart=Math.max(0,cart-1);render()">−</button><strong>${cart}</strong><button onclick="cart++;render()">+</button></div></div></div>${money()}<button class="main-btn" onclick="show('checkout')">متابعة إتمام الطلب</button>`:`<div class="empty"><div class="emoji">🛒</div><p>السلة فارغة</p>${button('تسوق الآن','home')}</div>`}</div>`;break;
case 'checkout':x=makeHeader('إتمام الطلب')+`<div class="pad"><div class="card"><strong>طريقة الاستلام</strong>${chips(['delivery','pickup'],fulfillment,'setFulfillment')}</div><div class="card"><div class="row"><strong>العنوان</strong><button class="link" onclick="changeLocation()">تغيير</button></div><p class="sub">${currentAddress}</p></div><div class="card"><strong>الموعد</strong><select class="field"><option>أقرب وقت متاح (يتحقق منه الخادم)</option><option>جدولة وفق ساعات المتجر</option></select></div><div class="card"><strong>رمز الخصم</strong><input class="field" placeholder="أدخل الرمز" value="${coupon}" oninput="coupon=this.value"><button class="muted-btn" onclick="alert('هذا نموذج UX؛ تأكيد القسيمة يتم من الخادم')">تطبيق</button></div>${money()}<button class="main-btn" onclick="show('success')">معاينة التأكيد (نموذج فقط)</button></div>`;break;
case 'success':x=makeHeader('تأكيد الطلب')+`<div class="pad"><div class="empty"><div class="emoji">✅</div><h3>تمثيل واجهة نجاح الطلب</h3><p>الرقم يظهر فقط بعد رد ناجح من الخادم في التطبيق الفعلي.</p><p>Merchant · ${isRest?'بيت الشام':'سوبرماركت الندى'}</p>${button('عرض التتبع','tracking','main-btn')}</div></div>`;break;
case 'tracking':x=makeHeader('تتبع الطلب')+`<div class="pad"><div class="card"><strong>الطلب لدى ${isRest?'المطعم':'المتجر'}</strong><p class="sub">التحديثات الفعلية تأتي من خدمة الطلب والتوصيل</p></div>${['بانتظار قبول التاجر','قيد التحضير','جاهز للاستلام',fulfillment==='pickup'?'تأكيد استلام العميل':'المندوب في الطريق','مكتمل'].map((s,i)=>`<div class="step ${i===0?'done':''}"><strong>${s}</strong><div class="note">التاريخ الفعلي عند توفره</div></div>`).join('')}<div class="row">${button('تفاصيل الطلب','orders')}${button('العودة للرئيسية','home')}</div></div>`;break;
case 'offers':x=makeHeader('العروض')+`<div class="pad"><div class="banner"><strong>عروض متاحة</strong><p>لا تُعرض خصومات مختلقة؛ البيانات الحية مطلوبة</p></div><div class="section-head"><h3>استكشف المنتجات</h3></div>${productCards()}</div>`;break;
case 'favorites':x=makeHeader('المفضلة')+`<div class="pad">${chips(['المتاجر','المنتجات'],filter,'selectFilter')}${merchantCards()}${productCards()}</div>`;break;
case 'orders':x=makeHeader('طلباتي')+`<div class="pad"><div class="card"><strong>سجل الطلبات</strong><p class="sub">تظهر الطلبات المكتملة وملخصاتها التاريخية من الخادم.</p>${button('عرض مسار التتبع','tracking')}${button('إعادة الطلب','reorder')}</div></div>`;break;
case 'filters':x=makeHeader('تصفية النتائج')+`<div class="pad"><div class="card"><h3>حالة التاجر</h3>${chips(['الكل','متاح الآن'],filter,'selectFilter')}<h3>الترتيب</h3>${chips(['الأقرب','الأعلى تقييماً'],filter,'selectFilter')}</div><button class="main-btn" onclick="show('discover')">تطبيق الفلاتر</button><button class="muted-btn" style="width:100%;margin-makeHeader:12px" onclick="filter='الكل';show('discover')">إعادة تعيين</button></div>`;break;
case 'group':case 'vote':case 'lucky':case 'compare':case 'lists':case 'reorder':case 'reviews':case 'alternatives':x=makeHeader(({group:'الطلب الجماعي',vote:'التصويت',lucky:'الصندوق المحظوظ',compare:'مقارنة المنتجات',lists:'قوائم التسوق',reorder:'مراجعة إعادة الطلب',reviews:'التقييمات',alternatives:'بدائل المنتجات'})[page])+`<div class="pad"><div class="card"><h3>ميزة موجودة — يُحافظ عليها</h3><p class="sub">هذا مسار مراجعة UX وليس تشغيلًا للميزة أو بديلًا عن تفاصيلها الفعلية. التصميم النهائي يستند إلى العقود والواجهات الحالية.</p>${page==='reorder'?productCards():merchantCards()}${button('العودة إلى المتجر','merchant')}</div></div>`;break;
case 'loading':x=makeHeader('جاري التحميل')+`<div class="pad">${[1,2,3].map(()=>'<div class="card" style="height:112px;background:linear-gradient(100deg,#fff,#ebeff5,#fff)"></div>').join('')}</div>`;break;
case 'empty':x=makeHeader('لا توجد نتائج')+`<div class="empty"><div class="emoji">🔎</div><h3>لم نجد نتائج مطابقة</h3><p>جرّب كلمة بحث مختلفة أو أزل بعض الفلاتر</p>${button('مسح الفلاتر','discover')}</div>`;break;
case 'error':x=makeHeader('تعذر تحميل القسم')+`<div class="pad"><div class="error">تعذر الاتصال الآن. يمكنك إعادة محاولة تحميل هذا القسم فقط، دون إفراغ السلة.</div><p></p>${button('إعادة المحاولة','home','main-btn')}</div>`;break;
case 'conflict':x=makeHeader('تحتاج السلة إلى مراجعة')+`<div class="pad"><div class="error">قد يكون السعر أو المخزون قد تغيّر. لا تعتمد المبلغ السابق قبل تسعير جديد.</div>${productCards()}${button('العودة إلى السلة','cart','main-btn')}</div>`;break;
case 'recovery':x=makeHeader('التحقق من طلبك')+`<div class="pad"><div class="card"><h3>نتحقق من نتيجة الإرسال السابق</h3><p class="sub">لا نعيد إرسال طلب جديد قبل الاستعلام باستخدام مفتاح المحاولة الأصلي.</p></div>${button('عرض حالتي الطلب','orders','main-btn')}</div>`;break;
default:x=makeHeader(title());} $('screen').innerHTML=x}
function setScope(s){scope=s;render()}function setFulfillment(s){fulfillment=s;render()}function selectModifier(s){selectedModifier=s;render()}function selectAlternative(s){selectedAlternative=s;render()}$('section').onchange=e=>changeSection(e.target.value);render();
</script></body></html>
